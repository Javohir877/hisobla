name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Saytni yig'ish (React + Vite) va testlar
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Yig'ilgan saytni ilovaga nusxalash
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/. android/app/src/main/assets/www/

      - name: Imzo kalitini tiklash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hisobla.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/hisobla.jks" >> "$GITHUB_ENV"
          fi

      - name: APK yig'ish
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/hisobla.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hisobla-apk
          path: hisobla.apk

      # Reliz matnining "---" gacha qismi ilovadagi "Nimalar yangi" oynasida ko'rinadi
      - name: Release'ga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hisobla 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            ---
            Hisobla Android ilovasi. Ilovaning o'zi yangi versiya chiqqanini xabar qiladi va yangilaydi.
            Birinchi marta o'rnatish uchun `hisobla.apk` faylini yuklab oling ("Noma'lum manbalardan o'rnatish"ga ruxsat bering).
          files: hisobla.apk
