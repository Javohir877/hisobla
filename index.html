<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Hisobla — ilmiy kalkulyator, kasrlar bosqichma-bosqich yechim bilan, o'lchov konvertori, foiz, BMI va kredit kalkulyatorlari."
    />
    <title>Hisobla — universal kalkulyator</title>
    <link rel="icon" href="avatar.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="avatar.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      /* Mavzu va ilova rejimi sahifa chizilishidan oldin qo'llanadi — rang "miltillamaydi" */
      (function () {
        var schemes = { light: "light", dark: "dark", amoled: "dark", ocean: "dark", forest: "dark",
          grape: "dark", sunset: "light", rose: "light", mint: "light" };
        var t = null;
        try { t = localStorage.getItem("hisobla-theme"); } catch (e) {}
        if (!schemes[t]) {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var root = document.documentElement;
        root.dataset.theme = t;
        root.dataset.scheme = schemes[t];
        // Android ilova ichida yoki o'rnatilgan (PWA) holatda — ilova ko'rinishi; ?app=1 — brauzerda sinash uchun
        var app = /HisoblaApp/.test(navigator.userAgent) ||
          (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true ||
          /[?&]app=1/.test(location.search);
        if (app) {
          root.classList.add("app-mode");
          document.querySelector('meta[name="viewport"]').content =
            "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Hisobla ishlashi uchun brauzeringizda JavaScript yoqilgan bo'lishi kerak.</noscript>
  </body>
</html>
